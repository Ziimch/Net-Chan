name: Build Net-Chan APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Net-Chan-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/Net-Chan-release.apk
          ls -lh dist

      - name: Upload Net-Chan-debug
        uses: actions/upload-artifact@v4
        with:
          name: Net-Chan-debug
          path: dist/Net-Chan-debug.apk

      - name: Upload Net-Chan-release
        uses: actions/upload-artifact@v4
        with:
          name: Net-Chan-release
          path: dist/Net-Chan-release.apk

      - name: Publish GitHub Release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Net-Chan ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Net-Chan-release.apk
