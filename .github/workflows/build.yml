name: Build Net-Chan APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mencari folder proyek Gradle otomatis (root repo, subfolder, atau di dalam file .zip
      # yang ikut ter-push), jadi build tetap jalan walaupun struktur repo berbeda.
      - name: Locate Gradle project
        id: proj
        run: |
          find_settings() {
            find "$1" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.git/*' | head -n 1
          }
          f=$(find_settings .)
          if [ -z "$f" ]; then
            echo "settings.gradle(.kts) tidak ada di repo, mencoba mengekstrak file .zip..."
            find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | while read -r z; do
              echo "Ekstrak: $z"
              unzip -q -o "$z" -d _extracted || true
            done
            [ -d _extracted ] && f=$(find_settings _extracted)
          fi
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts tidak ditemukan. Ekstrak NetChan.zip lalu push ISI foldernya (settings.gradle.kts, build.gradle.kts, folder app/)."
            echo "Isi repo:"; find . -maxdepth 3 -not -path './.git/*' | head -n 60
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Proyek Gradle ditemukan di: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug & Release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Rename APK
        env:
          PROJECT_DIR: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/Net-Chan-debug.apk
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" dist/Net-Chan-release.apk
          ls -lh dist

      - name: Upload Net-Chan-debug
        uses: actions/upload-artifact@v4
        with:
          name: Net-Chan-debug
          path: dist/Net-Chan-debug.apk

      - name: Upload Net-Chan-release
        uses: actions/upload-artifact@v4
        with:
          name: Net-Chan-release
          path: dist/Net-Chan-release.apk

      - name: Publish GitHub Release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Net-Chan ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/Net-Chan-release.apk
